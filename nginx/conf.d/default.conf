# ────────────────────────────────────────────
# New-API Nginx Configuration
# 日志 + HTTP→HTTPS 重定向 + SSL 反代
# ────────────────────────────────────────────

# ─── 日志格式 ───────────────────────────────
#log_format main '$remote_addr - $http_x_forwarded_for - [$time_local] '
#                '"$request" $status $body_bytes_sent '
#                '"$http_referer" "$http_user_agent" '
#                'rt=$request_time uct=$upstream_connect_time '
#                'uht=$upstream_header_time urt=$upstream_response_time';

# ─── HTTP (80) → HTTPS (443) 重定向 ─────────
server {
    listen 80;
    server_name ai-gateway.wdyxgames.com ai-gateway.jx.ruyi.cn;  # 替换为你的域名

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Let's Encrypt 验证（如使用 acme.sh 时会用到）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS (443) 主服务 ─────────────────────
server {
    listen 443 ssl http2;
    server_name ai-gateway.wdyxgames.com;  # 替换为你的域名

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── SSL 证书 ────────────────────────────
    # 将你的 .crt 和 .key 文件放入 nginx/ssl/ 目录，修改下方文件名
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSL 协议与加密套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL 会话缓存
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ─── 安全头部 ────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── 上传大小限制 ────────────────────────
    client_max_body_size 100m;

    # ─── 反向代理到 new-api ──────────────────
    location / {
        proxy_pass http://new-api:3000;
        proxy_http_version 1.1;

        # 请求头传递
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header X-Forwarded-Host    $host;

        # WebSocket / SSE 流式支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "";

        # 超时（适配 AI API 长连接）
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        # 流式响应不缓冲
        proxy_buffering off;
        proxy_request_buffering off;
    }
}


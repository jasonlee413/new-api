  pg_data:
    driver: local
#  mysql_data:
#    driver: local
#  clickhouse_data:
#    driver: local
  redis_data:
    driver: local

networks:
  new-api-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

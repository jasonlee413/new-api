# New-API Docker Compose Configuration
#
# Quick Start:
#   1. docker compose up --pull always -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line
#   2. Uncomment the mysql service and SQL_DSN line
#   3. Uncomment mysql in depends_on
#   4. Uncomment mysql_data in volumes section
#
# Production Deployment:
#   1. Copy .env.example to .env and update all passwords and secrets
#   2. Use `docker compose config` to validate before deploying
#   3. Set up health checks and monitoring for all services
#   4. Configure log drivers (e.g., splunk, awslogs) for production logging
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:${DB_PASSWORD:-123456}@postgres:5432/new-api
#      - SQL_DSN=root:${DB_PASSWORD:-123456}@tcp(mysql:3306)/new-api
#      - LOG_SQL_DSN=postgresql://root:${LOG_DB_PASSWORD:-123456}@postgres:5432/new-api-log
#      - LOG_SQL_DSN=clickhouse://default:${CLICKHOUSE_PASSWORD:-123456}@clickhouse:9000/new_api_logs
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=30
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-123456}@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=new-api-node-1
      - LOG_LEVEL=info
      - CRITICAL_RATE_LIMIT_ENABLE=false
#      - STREAMING_TIMEOUT=300
#      - RELAY_IDLE_CONN_TIMEOUT=90
#      - SESSION_SECRET=${SESSION_SECRET}
#      - SESSION_COOKIE_SECURE=true
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
#      - TRUSTED_PROXIES=172.20.0.0/16
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000
#      - SYNC_FREQUENCY=60
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
#      mysql:
#        condition: service_healthy
#      clickhouse:
#        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-123456}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: new-api
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

